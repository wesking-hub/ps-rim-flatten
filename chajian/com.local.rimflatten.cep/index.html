<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%; min-height: 100%;
      background-color: #323232 !important;
      box-sizing: border-box;
    }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 12px; background: #323232; color: #d6d6d6;
      padding: 10px 12px 14px; user-select: none;
      overflow-x: hidden;
    }
    h1 { font-size: 13px; margin: 0 0 2px; font-weight: 600; color: #f0f0f0; }
    .sub { font-size: 11px; color: #8f8f8f; margin-bottom: 10px; }
    .row { margin: 8px 0; }
    .row label { display: flex; justify-content: space-between; margin-bottom: 3px; color: #b6b6b6; }
    .row label b { color: #e8e8e8; }
    input[type=range] { width: 100%; }
    button {
      width: 100%; padding: 8px; margin-top: 8px; background: #2d6db5;
      color: #fff; border: 1px solid #3a82d0; border-radius: 4px;
      font-size: 13px; cursor: pointer;
    }
    button:hover:not(:disabled) { background: #3579c4; }
    button:disabled { opacity: .45; cursor: default; }
    .chk { display: flex; align-items: center; gap: 6px; margin: 8px 0 0; color: #b6b6b6; }
    .help {
      font-size: 11px; color: #9a9a9a; line-height: 1.7; margin: 0 0 8px;
      background: #2a2a2a; padding: 6px 8px; border-radius: 4px; border: 1px solid #3d3d3d;
    }
    #log {
      margin-top: 10px; padding: 7px 8px; background: #272727; border: 1px solid #3d3d3d;
      border-radius: 4px; font-size: 11px; line-height: 1.5; color: #a8a8a8;
      white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow-y: auto;
    }
    .ok { color: #7fc47f; } .warn { color: #d9b25f; } .err { color: #e07b7b; }
  </style>
</head>
<body>
  <h1>文字边缘修复 <span style="font-weight:normal;font-size:11px;color:#7fc47f;">v9</span></h1>
  <div class="sub">v9 联合通道算法：消除文字/色块波纹与底色凹凸，保留锐利边缘</div>

  <div class="help">
    用法：先建选区（框住文字 + 周围一圈背景，四周至少留 30px），再点下面按钮。<br>
    无需调参：v9 联合 Y/Cr/Cb 异方性平面回归，自动区分平坦底色与文字边缘。<br>
    耗时约 6–15 秒/百万像素，处理期间 PS 仍可操作。<br>
    默认生成独立「rim-flatten 修复层」；勾选下方选项则直接合并进当前图层。<br>
    说明：同步抹平色块内部色度与明度凹凸；白字与细小图标边缘优先保护，保持干净锐利。
  </div>
  <div class="chk"><input id="direct" type="checkbox" /><span>直接合并至当前图层（不生成独立图层）</span></div>

  <button id="run">开始处理选区</button>
  <div id="log">先建立选区（框住文字 + 周围一圈背景，四周至少留 30px），再点上面的按钮。</div>

  <script src="./lib/CSInterface.js"></script>
  <script src="./js/main.js"></script>
</body>
</html>
